<!DOCTYPE html>
<html lang="id" data-grade="SD">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makin Cerdas Makin Sukses | Game Edukasi SD, SMP & SMA</title>
  <meta name="description" content="Game edukasi seru berbasis pengetahuan untuk pelajar SD, SMP, dan SMA. Lengkap dengan latihan soal, simulasi TKA, dan musik pilihan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- SD: Fredoka + Quicksand | SMP: Rubik + Poppins | SMA: Chakra Petch + Rajdhani -->
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Fredoka:wght@600;700&family=Poppins:wght@500;600;700&family=Quicksand:wght@600;700&family=Rajdhani:wght@600;700&family=Rubik:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/games.css" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="topbar-left">
      <button id="btn-home-logo" class="brand" title="Kembali ke Beranda">
        <span class="brand-icon" id="brand-icon-slot"></span>
        <span class="brand-text">
          <strong>Makin Cerdas Makin Sukses</strong>
          <small id="brand-subtitle">Game Belajar SD, SMP & SMA</small>
        </span>
      </button>
    </div>

    <div class="topbar-center">
      <div class="grade-pill-group" role="radiogroup" aria-label="Pilih Jenjang">
        <button class="grade-pill" data-grade="SD" aria-checked="true">
          <span class="grade-icon-slot" data-icon="sd"></span> SD
        </button>
        <button class="grade-pill" data-grade="SMP" aria-checked="false">
          <span class="grade-icon-slot" data-icon="smp"></span> SMP
        </button>
        <button class="grade-pill" data-grade="SMA" aria-checked="false">
          <span class="grade-icon-slot" data-icon="sma"></span> SMA
        </button>
      </div>
    </div>

    <div class="topbar-right">
      <button id="btn-music" class="icon-btn music-btn" title="Musik Latar" aria-label="Studio Musik">
        <span id="music-icon-slot"></span>
        <span id="music-eq" class="eq-bars hidden" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
      </button>
      <button id="btn-sound" class="icon-btn" title="Efek Suara" aria-label="Efek Suara">
        <span id="sound-icon"></span>
      </button>
      <button id="btn-quests" class="icon-btn badge-btn" title="Misi Harian" aria-label="Misi Harian">
        <span id="quest-icon-slot"></span>
        <span id="quest-dot" class="notif-dot hidden"></span>
      </button>
      <button id="btn-profile" class="profile-chip" title="Profil & Lencana">
        <span id="nav-avatar" class="avatar-mini">🧑‍🚀</span>
        <div class="profile-chip-info">
          <span id="nav-name" class="chip-name">Pelajar</span>
          <span id="nav-level" class="chip-level">Lv. 1 • 0 XP</span>
        </div>
      </button>
    </div>
  </header>

  <main id="app-root" class="app-root"></main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-content" class="modal-card"></div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
